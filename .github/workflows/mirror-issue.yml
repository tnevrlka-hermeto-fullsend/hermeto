name: Mirror upstream issue
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Upstream hermetoproject/hermeto issue number'
        required: true
      start_stage:
        description: 'Which stage to start'
        type: choice
        options:
          - triage
          - code
        default: triage
  issues:
    types: [opened]

jobs:
  # Path 1: workflow_dispatch — creates a new mirror issue
  mirror-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Fetch upstream and create mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM="hermetoproject/hermeto"
          ISSUE="${{ inputs.issue_number }}"

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state all \
            --search "<!-- upstream-issue: ${ISSUE} -->" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::error::Mirror for upstream issue ${ISSUE} already exists as #${EXISTING}"
            exit 1
          fi

          TITLE=$(gh issue view "$ISSUE" --repo "$UPSTREAM" --json title --jq .title)
          BODY=$(gh issue view "$ISSUE" --repo "$UPSTREAM" --json body --jq .body)
          COMMENTS=$(gh issue view "$ISSUE" --repo "$UPSTREAM" --json comments \
            --jq '.comments[] | "**\(.author.login)** (\(.createdAt[:10])):\n\(.body)\n"')

          if [ "${{ inputs.start_stage }}" = "triage" ]; then
            LABEL="ready-to-triage"
          else
            LABEL="ready-to-code"
          fi

          MIRROR_BODY=$(printf '<!-- upstream-issue: %s -->\n\n%s\n\n---\n\n## Discussion\n\n%s' \
            "$ISSUE" "$BODY" "$COMMENTS")

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$MIRROR_BODY" \
            --label "$LABEL"

  # Path 2: issue form — detect template, parse fields, enrich
  parse-template:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      is_mirror: ${{ steps.parse.outputs.is_mirror }}
      upstream_issue: ${{ steps.parse.outputs.upstream_issue }}
      start_stage: ${{ steps.parse.outputs.start_stage }}
    steps:
      - name: Parse issue form fields
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          UPSTREAM=$(echo "$ISSUE_BODY" | awk '/^### Upstream issue number/{getline;getline;print}')
          STAGE=$(echo "$ISSUE_BODY" | awk '/^### Starting stage/{getline;getline;print}')

          if [ -z "$UPSTREAM" ] || ! echo "$UPSTREAM" | grep -qE '^[0-9]+$'; then
            echo "is_mirror=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_mirror=true" >> "$GITHUB_OUTPUT"
          echo "upstream_issue=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "start_stage=${STAGE:-triage}" >> "$GITHUB_OUTPUT"

  enrich-template:
    needs: parse-template
    if: needs.parse-template.outputs.is_mirror == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Fetch upstream and enrich mirror issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM="hermetoproject/hermeto"
          ISSUE="${{ needs.parse-template.outputs.upstream_issue }}"
          FORK_ISSUE="${{ github.event.issue.number }}"
          STAGE="${{ needs.parse-template.outputs.start_stage }}"

          TITLE=$(gh issue view "$ISSUE" --repo "$UPSTREAM" --json title --jq .title)
          BODY=$(gh issue view "$ISSUE" --repo "$UPSTREAM" --json body --jq .body)
          COMMENTS=$(gh issue view "$ISSUE" --repo "$UPSTREAM" --json comments \
            --jq '.comments[] | "**\(.author.login)** (\(.createdAt[:10])):\n\(.body)\n"')

          if [ "$STAGE" = "triage" ]; then
            LABEL="ready-to-triage"
          else
            LABEL="ready-to-code"
          fi

          MIRROR_BODY=$(printf '<!-- upstream-issue: %s -->\n\n%s\n\n---\n\n## Discussion\n\n%s' \
            "$ISSUE" "$BODY" "$COMMENTS")

          gh issue edit "$FORK_ISSUE" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$MIRROR_BODY" \
            --add-label "$LABEL"
