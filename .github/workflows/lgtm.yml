name: LGTM — approve for upstream
on:
  pull_request_review:
    types: [submitted]

jobs:
  approve-for-upstream:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label, comment, and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          gh pr edit "$PR" --repo "$REPO" --add-label "approved-for-upstream"

          gh pr comment "$PR" --repo "$REPO" --body "$(cat <<'COMMENT'
          ## Approved for upstream

          This PR has been approved for filing upstream. Next steps:

          1. Cherry-pick the commits into your personal fork of `hermetoproject/hermeto`
          2. Open a PR against `hermetoproject/hermeto`
          3. Adapt the PR description to upstream's contribution guidelines

          Closing this PR now — it was never intended to be merged into the fork.
          COMMENT
          )"

          gh pr close "$PR" --repo "$REPO"
